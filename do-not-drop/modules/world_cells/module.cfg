[module]
name="world_cells"
summary="WorldCellGrid (which square cells of a big map to keep loaded around moving anchors, with hysteresis and a minimum stay), WorldCellStreamer (loads them on a thread, instances them in small per-frame slices, shows a cheap impostor for the far ones) and WorldCellInterest (the host sends each tracked body's MultiplayerSynchronizer only to the peers whose anchor is within the load radius, with the same hysteresis and a keepalive pulse; the clients hide their far copies and take them out of physics)."
depends=[]
