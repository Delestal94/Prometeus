[module]
name="world_cells"
summary="WorldCellGrid (which square cells of a big map to keep loaded around moving anchors, with hysteresis and a minimum stay; pinned cells far from every anchor stay loaded but are parked, not drawn), WorldCellStreamer (loads them on a thread, instances them in small per-frame slices, shows a cheap impostor for the far and the parked ones) and WorldCellInterest (the host sends each tracked body's MultiplayerSynchronizer only to the peers whose anchor is within the load radius, with the same hysteresis and a keepalive pulse; the clients hide their far copies and take them out of physics)."
depends=[]
