[module]
name="route_gen"
summary="Procedural road: RouteSegment (a chainable, code-built piece with an exit pose), SegmentStreamer (builds segments ahead of a target and culls behind, with combination rules and a difficulty ramp), TerrainField (one height field for rendering, physics and prop placement, with rivers, crests, flat zones and tunnels) and the code-built segments (straight, speed bump, curve, S-curve, gravel, hill)."
