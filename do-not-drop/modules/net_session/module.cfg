[module]
name="net_session"
summary="A co-op session with two transports (Steam lobby or ENet), a versioned join handshake carrying opaque host state, roster, host-driven restart and failure codes (NetSession); a host-authoritative event bus with relay() and rate-limited peer requests (NetEventBus); checks for any_peer RPCs: sender, finite values, bounded dictionaries, text, ids and paths, a per-peer request budget with a reserve for critical requests (RpcGuard); rejoin by identity (Steam id, or on LAN a per-session hash chain of a per-process token that is useless replayed), and a full room that takes back a player whose ghost holds its place (NetAdmission); Steam voice capture (SteamVoice); connection stats, --net-sim profiles and an overlay (NetStats, NetStatsOverlay)."
depends=[]
