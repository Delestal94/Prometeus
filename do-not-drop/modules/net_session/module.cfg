[module]
name="net_session"
summary="A co-op session with two transports (Steam lobby or ENet), a versioned join handshake carrying opaque host state, roster, host-driven restart and failure codes (NetSession); a host-authoritative event bus with relay() and rate-limited peer requests (NetEventBus); checks for any_peer RPCs: sender, finite values, bounded dictionaries and text, a per-peer request budget (RpcGuard); rejoin by identity (Steam id or a hashed per-process token); Steam voice capture (SteamVoice); connection stats, --net-sim profiles and an overlay (NetStats, NetStatsOverlay)."
depends=[]
