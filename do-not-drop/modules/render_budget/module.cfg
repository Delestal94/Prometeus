[module]
name="render_budget"
summary="Frames on modest hardware with GL Compatibility: WorldQuality presets, DressingBatcher (MultiMesh batching of static dressing with colliders), StaticMerger (the static meshes of many small code-built pieces folded into a few, their holders freed, at once or in steps), WorldQuality.set_view_range (a scaled draw range for small parts), DetailMaterials (triplanar detail, seasons, night glow) and ContactShadow (fake contact shadows) and FrameSlicer (cuts a long main-thread job into per-frame slices so a loading screen keeps drawing)."
depends=[]
