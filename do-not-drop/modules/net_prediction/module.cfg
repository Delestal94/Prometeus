[module]
name="net_prediction"
summary="Client-side prediction for a body the host owns but a client controls. NetInputBuffer: the host plays a remote peer's numbered inputs back one per physics tick, behind a small jitter cushion, and says which input its pose stands for. NetPredictionReconciler: the client keeps its predicted states by input number, compares the host's state for that input and eases the difference into its own body without re-simulating. NetDelayQueue: one way of a bad link simulated where the transport simulates nothing (a --net-sim profile's lag, jitter and loss, in order)."
depends=[]
