name: Bug
description: Algo no anda como debería
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasó
      description: Qué viste y qué esperabas ver.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Cómo reproducirlo
      placeholder: |
        1. Crear sala / jugar solo / Endless
        2. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Modo
      options: [Solo, Multijugador (host), Multijugador (cliente), Endless]
  - type: textarea
    id: log
    attributes:
      label: Log de Godot / captura
      description: Errores de la consola o una captura, si hay.
      render: text
