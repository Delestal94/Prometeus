name: Agent review

# An agent reviews every PR instead of a person. It comments; it never blocks:
# the required checks (lint, tests, network) are the gate. Needs the
# CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`, then
# `gh secret set CLAUDE_CODE_OAUTH_TOKEN`); without it the job skips.

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for the review token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 25
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
          prompt: |
            Review PR #${{ github.event.pull_request.number }} of ${{ github.repository }}.
            Follow .claude/agents/revisor-gdscript.md (project conventions, .tscn gotchas,
            simulation/presentation split, EventBus, typing) and CLAUDE.md. Also flag:
            user-visible text without tr(), per-frame node/group scans, new `.call(&"…")` /
            `.get(&"…")` / `/root/` lookups where a typed reference fits, files touching the
            other member's domain without an entry in docs/colaboracion-equipo.md, and a
            change without a test. Only real problems with file:line; no style nits the
            linter already covers. Post ONE comment with `gh pr comment`, in Spanish,
            ranked by severity; if nothing is wrong, say so in one line.
