name: Auto-merge pull requests

# No human review gate on purpose: the required checks (lint, headless tests,
# network pair) are the gate.
# pull_request_target never checks out the PR's code here; it only queues the
# merge. Forks are excluded so an outside PR can never merge itself.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      ${{ !github.event.pull_request.draft &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Queue auto-merge after required checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash --delete-branch
