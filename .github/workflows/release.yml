name: Release builds

# N-210: every v* tag exports Windows and Linux with tools/export/export_presets.cfg
# and attaches both zips to a DRAFT release of that tag (public repo: never published by CI). The tag (without the
# "v") becomes application/config/version, which the main menu shows.
# D-2020: the Linux build must also boot the company mode (tools/export/smoke-company.sh) before anything is
# zipped, so a build whose expansion does not come up never reaches a release.
# A manual run publishes nothing: no release whatever the ref, and no run artifact unless keep_builds asks for it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (no release is published for manual runs)'
        required: false
        default: '0.0.0-dev'
      keep_builds:
        description: 'Keep the zips as a run artifact (public repo: anyone signed in to GitHub can download it)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    name: Export Windows + Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Version from tag
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${MANUAL_VERSION:-0.0.0-dev}"
          fi
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$ ]]; then
            echo "::error::invalid version: use up to 64 letters, digits, dots, pluses, or hyphens"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Godot and the release export templates (SHA-512 checked, cached)
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"

      - name: Stamp version and presets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tools/export/stamp_version.py do-not-drop/project.godot "$VERSION"
          cp tools/export/export_presets.cfg do-not-drop/export_presets.cfg

      - name: Import project
        run: |
          timeout 600 ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path do-not-drop --import

      - name: Export
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p builds/windows builds/linux
          $godot --headless --path do-not-drop --export-release "Windows Desktop" ../builds/windows/TakeMyPackage.exe
          $godot --headless --path do-not-drop --export-release "Linux" ../builds/linux/TakeMyPackage.x86_64
          # Godot can print an error and still exit 0: check the files are really there.
          for f in builds/windows/TakeMyPackage.exe builds/windows/TakeMyPackage.pck \
                   builds/windows/steam_api64.dll \
                   builds/linux/TakeMyPackage.x86_64 builds/linux/TakeMyPackage.pck \
                   builds/linux/libsteam_api.so; do
            test -s "$f" || { echo "::error::missing export output $f"; ls -la builds/*; exit 1; }
          done

      - name: Smoke test (Linux build loads)
        run: |
          # The exported build must boot to the menu without missing resources or scripts.
          set +e
          timeout 60 builds/linux/TakeMyPackage.x86_64 --headless --quit-after 120 2>&1 | tee /tmp/smoke.log
          smoke_status=${PIPESTATUS[0]}
          set -e
          if [[ "$smoke_status" -ne 0 ]]; then
            echo "::error::exported build exited with status $smoke_status"
            exit "$smoke_status"
          fi
          if grep -E "Failed to load|Cannot open|Parse Error|SCRIPT ERROR" /tmp/smoke.log; then
            echo "::error::exported build logged load errors"; exit 1
          fi

      - name: Smoke test (Linux build boots the company mode)
        env:
          # The guard only has to end a boot that never quits: a slow runner is not a hang.
          SMOKE_GUARD_SECONDS: 300
          SMOKE_LOGS: ${{ runner.temp }}/smoke-company
        run: |
          # D-2020: the menu says nothing about the expansion. The script boots the build to the menu and into
          # the company (--autostart-company), wants the company's save written and looks inside the pack with
          # the editor (GODOT, set by setup-godot). Its last line is the verdict: anything but "Empresa OK" fails.
          set +e
          bash tools/export/smoke-company.sh builds/linux | tee /tmp/smoke-company.txt
          smoke_status=${PIPESTATUS[0]}
          set -e
          verdict="$(tail -n 1 /tmp/smoke-company.txt)"
          if [[ "$smoke_status" -ne 0 || "$verdict" != "Empresa OK" ]]; then
            echo "::error::company smoke of the exported build: ${verdict:-no verdict} (exit $smoke_status)"
            exit 1
          fi

      - name: Keep the logs of a failed company smoke
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-company-logs
          path: ${{ runner.temp }}/smoke-company
          if-no-files-found: ignore
          retention-days: 7

      - name: Zip builds
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd builds/windows && zip -qr "../../TakeMyPackage-${VERSION}-windows.zip" .)
          (cd builds/linux && zip -qr "../../TakeMyPackage-${VERSION}-linux.zip" .)
          sha256sum *.zip > SHA256SUMS.txt
          ls -la *.zip
          cat SHA256SUMS.txt

      - name: Upload artifacts
        # A run artifact of a public repo is a download for anyone signed in to GitHub. A tag needs it (the publish
        # job attaches it to the draft); a manual run keeps it only when asked.
        if: github.event_name == 'push' || inputs.keep_builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: builds-${{ steps.version.outputs.version }}
          path: |
            *.zip
            SHA256SUMS.txt

  publish:
    name: Publish GitHub release
    # Only a pushed tag: a manual run on a tag ref would otherwise upload over that tag's release.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: builds-${{ needs.export.outputs.version }}

      - name: Attach builds to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # The repo is public: a published release would let anyone download the game. Builds go to
          # a DRAFT (only people with write access see it); publishing it is a person's decision.
          # The weekly release train may already have drafted this tag's notes: reuse that draft.
          if ! gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '.[].tagName' | grep -qx "$tag"; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft --verify-tag --title "$tag" --generate-notes
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" *.zip SHA256SUMS.txt --clobber
