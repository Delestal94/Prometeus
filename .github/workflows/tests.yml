name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only a PR's older run is stale. On main each commit gets its own group, so no run is cancelled
  # or left pending behind another: every merged commit is tested whole.
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2

jobs:
  lint:
    name: GDScript lint (gdlint, ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.5.0"

      - name: Lint against baseline
        run: bash tools/lint.sh

      - name: Every test describes itself in its header
        run: bash tools/list-tests.sh --missing

      - name: Portable modules name nothing of the game
        run: python3 tools/check_modules.py

  # The suite split across four runners (SHARD in run-tests.sh): one runner
  # took ~21 min, a quarter each takes ~6. "Tests headless (Godot 4.7.2)"
  # below is the single check branch protection requires.
  headless:
    name: Tests headless ${{ matrix.shard }}/4 (Godot 4.7.2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Import project
        run: |
          timeout 600 ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path do-not-drop --import

      - name: Run tests
        env:
          GODOT: /home/runner/godot/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64
          JOBS: 2
          # A hung test shows up in 2 minutes instead of 5. The known slow
          # ones (SLOW_TESTS in run-tests.sh) get twice that.
          TEST_TIMEOUT: 120
          REPORT_FILE: ${{ runner.temp }}/godot-headless-report.csv
          SHARD: ${{ matrix.shard }}/4
        run: bash tools/run-tests.sh -v

      - name: Upload per-test audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-headless-audit-${{ github.run_id }}-attempt-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/godot-headless-report.csv
          if-no-files-found: warn
          retention-days: 90

  headless-result:
    name: Tests headless (Godot 4.7.2)
    needs: headless
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.headless.result }}"
          test "${{ needs.headless.result }}" = success

  modules:
    name: Portable modules in an empty project (Godot 4.7.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Each module's tests, alone with its declared dependencies
        env:
          GODOT: /home/runner/godot/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64
          TEST_TIMEOUT: 120
        run: bash tools/portability-check.sh -v

  runtime-audit:
    name: Runtime performance and visual captures (Godot 4.7.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Import project
        run: timeout 600 ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path do-not-drop --import

      - name: Record runner metadata
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-audit/captures" "$RUNNER_TEMP/godot-userdata"
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_os=$RUNNER_OS"
            echo "image_os=$ImageOS"
            echo "image_version=$ImageVersion"
            echo "godot_version=$(~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --version)"
            echo "benchmark_mode=delivery"
            echo "benchmark_seed=4242"
            echo "benchmark_duration_seconds=30"
            echo "benchmark_hitch_threshold_ms=33"
            echo "render_resolution=1280x720"
            echo "render_driver=software (LIBGL_ALWAYS_SOFTWARE=1)"
            uname -a
            lscpu
            free -h
          } > "$RUNNER_TEMP/runtime-audit/runner-metadata.txt"

      - name: Capture HUD states for visual review
        env:
          GODOT: /home/runner/godot/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64
          XDG_DATA_HOME: ${{ runner.temp }}/godot-userdata
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a "$GODOT" --path do-not-drop --script res://tests/render_hud.gd 2>&1 | tee "$RUNNER_TEMP/runtime-audit/render-hud.log"
          find "$XDG_DATA_HOME" -type f -name 'render_hud_*.png' -exec cp {} "$RUNNER_TEMP/runtime-audit/captures/" \;
          capture_count=$(find "$RUNNER_TEMP/runtime-audit/captures" -type f -name '*.png' | wc -l)
          test "$capture_count" -ge 5

      - name: Measure rendered performance
        if: always()
        env:
          GODOT: /home/runner/godot/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 120 xvfb-run -a "$GODOT" --path do-not-drop --script res://tests/bench_drive.gd -- --seconds=30 --seed=4242 --hitch=33 2>&1 | tee "$RUNNER_TEMP/runtime-audit/bench-drive.log"

      - name: Upload runtime audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-audit-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-audit/
          if-no-files-found: warn
          retention-days: 90

  network-pair:
    name: Network pair (Godot 4.7.2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Import project
        run: |
          timeout 600 ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path do-not-drop --import

      - name: Run two-process gameplay checks
        env:
          GODOT: /home/runner/godot/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64
        run: |
          set -o pipefail
          bash tools/run-net-pair.sh | tee "$RUNNER_TEMP/network-pair-audit.log"

      - name: Upload network latency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-pair-audit-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-pair-audit.log
          if-no-files-found: warn
          retention-days: 90

  network-trio:
    name: Network trio with late join (Godot 4.7.2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Import project
        run: timeout 600 ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path do-not-drop --import

      - name: Run three-peer late-join gameplay check
        env:
          GODOT: /home/runner/godot/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64
        run: bash tools/run-net-trio.sh
